name: Update Repeater Data

# Automatically scrapes Malaysian repeater frequencies from RepeaterBook,
# merges them into 9M2PJU.csv, regenerates the static SEO HTML, and commits
# any changes to main.
#
# Required repository secret:
#   REPEATERBOOK_EUID - your RepeaterBook numeric user ID (e.g. 104805).
#     Find it in your RepeaterBook download URL:
#     https://www.repeaterbook.com/repeaters/downloads/csv/index2.php?euid=<EUID>&func=route
#
# Add it via: repo Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    # 1st of each month at 03:30 UTC (avoid GH Actions queue congestion)
    - cron: '30 3 1 * *'
  workflow_dispatch: # Allow manual runs from the Actions tab

permissions:
  contents: write # Needed to push commits to main

concurrency:
  group: update-repeaterbook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download RepeaterBook CSV
        env:
          REPEATERBOOK_EUID: ${{ secrets.REPEATERBOOK_EUID }}
        run: |
          set -euo pipefail

          if [ -z "${REPEATERBOOK_EUID:-}" ]; then
            echo "::warning::REPEATERBOOK_EUID secret is not set in repository secrets. Skipping RepeaterBook sync."
            echo "To enable automatic monthly sync, add REPEATERBOOK_EUID in GitHub Repo Settings → Secrets and variables → Actions."
            exit 0
          fi

          URL="https://www.repeaterbook.com/repeaters/downloads/csv/index2.php?euid=${REPEATERBOOK_EUID}&func=route"
          echo "Downloading repeater data from RepeaterBook..."
          
          curl -sS --fail --location --retry 5 --retry-delay 5 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --connect-timeout 30 \
            --max-time 120 \
            -o repeaterbook.csv \
            "$URL" || {
              echo "::error::Failed to download CSV from RepeaterBook. The EUID may be invalid or Cloudflare is blocking the connection."
              exit 1
            }

          # Validate the download looks like a CSV, not an HTML error or Cloudflare block page
          if [ ! -f repeaterbook.csv ] || ! head -1 repeaterbook.csv | grep -q "Output Freq"; then
            echo "::error::Downloaded file does not contain expected RepeaterBook CSV header."
            echo "::error::First line received:"
            head -1 repeaterbook.csv | head -c 500
            exit 1
          fi

          ROWS=$(($(wc -l < repeaterbook.csv) - 1))
          echo "Successfully downloaded ${ROWS} repeater entries from RepeaterBook."

      - name: Merge into 9M2PJU.csv
        if: hashFiles('repeaterbook.csv') != ''
        run: node scripts/merge_repeaterbook.js repeaterbook.csv

      - name: Rebuild static SEO HTML
        if: hashFiles('repeaterbook.csv') != ''
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected - repeater data is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: Update repeater data from RepeaterBook" \
                    -m "Scraped and merged repeater frequencies/locations from RepeaterBook into 9M2PJU.csv and regenerated static SEO HTML."
          git push
